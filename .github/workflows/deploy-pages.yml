# Tự động build và xuất bản trang lên GitHub Pages mỗi khi push lên nhánh main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: npx vite build --base="$BASE_PATH"

      - name: Adapt build for GitHub Pages sub-path
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const base = process.env.BASE_PATH;            // vd: /Song-H-/
          const prefix = base.replace(/\/$/, '');        // vd: /Song-H-
          const esc = prefix.replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&');
          const dir = 'dist/assets';
          for (const f of fs.readdirSync(dir).filter((f) => f.endsWith('.js'))) {
            const p = path.join(dir, f);
            let s = fs.readFileSync(p, 'utf8');
            s = s
              .split('`/assets/aistudio/').join('`' + base + 'assets/aistudio/')
              .split('"/assets/aistudio/').join('"' + base + 'assets/aistudio/')
              .split('href:`/`').join('href:`' + base + '`')
              .split('window.location.origin').join('(window.location.origin+"' + prefix + '")')
              .split('window.location.pathname').join('(window.location.pathname.replace(/^' + esc + '(?=\\/|$)/,"")||"/")');
            fs.writeFileSync(p, s);
          }
          const shim = `<script>(function(){var b=${JSON.stringify(prefix)};['pushState','replaceState'].forEach(function(m){var o=history[m];history[m]=function(s,t,u){if(typeof u==='string'&&u.charAt(0)==='/'&&u.indexOf(b+'/')!==0&&u!==b){u=b+u;}return o.call(this,s,t,u);};});})();</script>`;
          let html = fs.readFileSync('dist/index.html', 'utf8').replace('<head>', '<head>\n    ' + shim);
          fs.writeFileSync('dist/index.html', html);
          fs.writeFileSync('dist/404.html', html);   // cho phép mở trực tiếp /invite/..., /dashboard...
          fs.writeFileSync('dist/.nojekyll', '');
          JS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

    <script>
      (function() {
        // Intercept and demote non-fatal Google Token Service disabled error logs to console.warn
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) {
            try {
              return typeof a === 'object' ? JSON.stringify(a) : String(a);
            } catch(e) {
              return String(a);
            }
          }).join(' ');

          if (
            text.indexOf('token-service-api-has-not-been-used') !== -1 ||
            text.indexOf('securetoken.googleapis.com') !== -1 ||
            text.indexOf('Could not reach Cloud Firestore backend') !== -1
          ) {
            console.warn('[Handled Firebase Service Warning]:', text);
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        try {
          var t = localStorage.getItem('thieponl_theme') || 'system';
          var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
